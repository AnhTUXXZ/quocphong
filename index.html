<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Ôn Tập Quốc Phòng</title>
    <style>
        /* === TONE MÀU QUÂN ĐỘI === */
        :root {
            --army-dark: #2c3525;    /* Xanh rêu đậm */
            --army-medium: #4b5320;  /* Xanh olive */
            --army-light: #8a9a5b;   /* Xanh lính nhạt */
            --khaki: #e6e2d3;        /* Vàng cát / Khaki */
        }

        /* Đổi TOÀN BỘ font chữ sang Times New Roman */
        * {
            font-family: 'Times New Roman', Times, serif !important;
        }

        body {
            background-color: var(--army-medium);
            margin: 0;
            padding: 0;
            color: var(--army-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-banner {
            background-color: var(--army-dark);
            color: var(--khaki);
            text-align: center;
            padding: 25px 20px;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 5px solid #1a1f16;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Lưới chứa các nút bấm */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            background-color: var(--khaki);
            padding: 30px;
            border: 4px solid var(--army-dark);
            border-radius: 12px;
            box-shadow: 8px 8px 0px var(--army-dark);
        }

        /* Nút chuyển hướng */
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--army-dark);
            color: var(--khaki);
            text-decoration: none;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #1a1f16;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
        }

        .menu-item span {
            font-size: 1rem;
            margin-top: 8px;
            color: var(--army-light);
        }

        .menu-item:hover {
            background-color: var(--army-light);
            color: var(--army-dark);
            transform: translateY(-5px);
            box-shadow: 4px 8px 15px rgba(0,0,0,0.4);
            border-color: var(--army-dark);
        }

        .menu-item:hover span {
            color: var(--army-dark);
        }

        .footer {
            background-color: var(--army-dark);
            color: var(--khaki);
            text-align: center;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* === GIAO DIỆN POPUP NHẬP THÔNG TIN (ĐÃ CHỈNH NHỎ VÀ CÂN ĐỐI) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; /* Ẩn mặc định, JS sẽ bật lên */
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background-color: var(--khaki);
            padding: 25px 20px; /* Thu gọn khoảng cách viền trong */
            border-radius: 10px;
            border: 4px solid var(--army-dark);
            width: 90%;
            max-width: 320px; /* Làm khung hẹp lại cho gọn gàng */
            text-align: center;
            box-shadow: 6px 6px 0px var(--army-dark); /* Viền bóng gọn hơn */
        }

        .modal-content h2 {
            color: var(--army-dark);
            margin-top: 0;
            margin-bottom: 15px; /* Giảm khoảng cách dưới tiêu đề */
            font-size: 22px; /* Chữ tiêu đề vừa vặn hơn */
            font-weight: bold;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 12px; /* Giảm khoảng cách giữa các ô nhập */
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            color: var(--army-dark);
            margin-bottom: 4px;
            font-size: 15px; /* Cỡ chữ nhãn vừa phải */
        }

        .input-group input {
            width: 100%;
            padding: 10px; /* Giảm độ dày ô nhập */
            border: 2px solid var(--army-light);
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--army-dark);
        }

        .btn-submit {
            background-color: var(--army-dark);
            color: var(--khaki);
            border: 2px solid #1a1f16;
            padding: 10px 20px; /* Nút bấm gọn lại */
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
            width: 100%;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: #1a1f16;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .error-msg {
            color: red;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="infoPopup" class="modal-overlay">
        <div class="modal-content">
            <h2>Khai Báo Thông Tin</h2>
            <div id="errorMsg" class="error-msg">Vui lòng điền đầy đủ tất cả thông tin!</div>
            
            <div class="input-group">
                <label for="hoTen">Họ và Tên:</label>
                <input type="text" id="hoTen" placeholder="VD: Nguyễn Văn A" required>
            </div>
            
            <div class="input-group">
                <label for="daiDoi">Đại đội:</label>
                <input type="number" id="daiDoi" placeholder="VD: 22" required>
            </div>
            
            <div class="input-group">
                <label for="tieuDoi">Tiểu đội:</label>
                <input type="number" id="tieuDoi" placeholder="VD: 2" required>
            </div>
            
            <button id="btnXacNhan" class="btn-submit" onclick="xacNhanThongTin()">XÁC NHẬN</button>
        </div>
    </div>

    <div class="header-banner">
        HỆ THỐNG TRẮC NGHIỆM QUỐC PHÒNG
    </div>

    <div class="container">
        <div class="menu-grid">
            <a href="https://anhtuxxz.github.io/quocphong/ct1.html" class="menu-item" target="_blank">
                CT 1
                <span>Nhấn để làm bài</span>
            </a>
            
            <a href="https://anhtuxxz.github.io/quocphong/c2.html" class="menu-item" target="_blank">
                CT 2
                <span>Nhấn để làm bài</span>
            </a>
            
            <a href="https://anhtuxxz.github.io/quocphong/c3.html" class="menu-item" target="_blank">
                CT 3
                <span>Nhấn để làm bài</span>
            </a>
            
            <a href="https://anhtuxxz.github.io/quocphong/c4.html" class="menu-item" target="_blank">
                CT 4
                <span>Nhấn để làm bài</span>
            </a>
            
            <a href="https://anhtuxxz.github.io/quocphong/c5.html" class="menu-item" target="_blank">
                CT 5
                <span>Nhấn để làm bài</span>
            </a>

            <a href="https://anhtuxxz.github.io/quocphong/c6.html" class="menu-item" target="_blank">
                CT 6
                <span>Nhấn để làm bài</span>
            </a>

            <a href="https://anhtuxxz.github.io/quocphong/c7.html" class="menu-item" target="_blank">
                CT 7
                <span>Nhấn để làm bài</span>
            </a>
        </div>
    </div>

    <div class="footer">
        NguyenAnhTu-K16THO1-QuocPhong
    </div>

    <script>
        // Cấu hình Bot Telegram
        const TELEGRAM_BOT_TOKEN = '8414314561:AAHYLevOgv0H6Y3HSztEsJA17nCBIuMHlwE';
        const TELEGRAM_CHAT_ID = '7209414522';

        // Khi load trang
        document.addEventListener('DOMContentLoaded', () => {
            // Kiểm tra xem localStorage đã có thông tin chưa
            const savedData = localStorage.getItem('hocVienQuocPhong');
            
            if (!savedData) {
                // Nếu chưa có, hiện popup bắt buộc nhập
                document.getElementById('infoPopup').style.display = 'flex';
            }
        });

        // Hàm xử lý khi ấn nút "Xác nhận"
        function xacNhanThongTin() {
            const hoTen = document.getElementById('hoTen').value.trim();
            const daiDoi = document.getElementById('daiDoi').value.trim();
            const tieuDoi = document.getElementById('tieuDoi').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btnXacNhan = document.getElementById('btnXacNhan');

            // 1. Validate không cho bỏ trống
            if (hoTen === "" || daiDoi === "" || tieuDoi === "") {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            // Đổi text nút thành đang xử lý
            btnXacNhan.innerText = "ĐANG XỬ LÝ...";
            btnXacNhan.disabled = true;

            // 2. Lưu vào LocalStorage
            const thongTin = {
                hoTen: hoTen,
                daiDoi: daiDoi,
                tieuDoi: tieuDoi,
                thoiGian: new Date().toLocaleString()
            };
            localStorage.setItem('hocVienQuocPhong', JSON.stringify(thongTin));

            // 3. Chuẩn bị tin nhắn gửi về Telegram
            const textMessage = `
📝 <b>CÓ HỌC VIÊN MỚI TRUY CẬP HỆ THỐNG</b>
👤 Họ và tên: <b>${hoTen}</b>
🏢 Đại đội: ${daiDoi}
⛺ Tiểu đội: ${tieuDoi}
⏰ Thời gian: ${thongTin.thoiGian}
            `;

            // 4. Gửi API tới Telegram
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            const payload = {
                chat_id: TELEGRAM_CHAT_ID,
                text: textMessage,
                parse_mode: 'HTML'
            };

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                // Tắt popup sau khi gửi thành công
                document.getElementById('infoPopup').style.display = 'none';
            })
            .catch(error => {
                console.error('Lỗi khi gửi Telegram:', error);
                // Dù lỗi mạng thì vẫn ẩn popup cho người dùng làm bài (vì đã lưu local)
                document.getElementById('infoPopup').style.display = 'none';
            });
        }
    </script>
</body>
</html>
