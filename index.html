<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống thi trắc nghiệm A-B-C-D</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: #f1f5f9;
        }

        .option-label input {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Feedback Styles */
        .option-label.correct-choice {
            border-color: var(--success-color);
            background-color: #f0fdf4;
            color: #166534;
        }

        .option-label.wrong-choice {
            border-color: var(--error-color);
            background-color: #fef2f2;
            color: #991b1b;
        }

        .btn-action {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 24px;
        }

        .footer {
            margin-top: 30px;
            font-weight: bold;
            color: #64748b;
        }

        #next-btn { display: none; background-color: #0f172a; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <div class="header">
            <h2 id="quiz-title">Bài Thi Trắc Nghiệm</h2>
            <p id="progress-text">Đang tải...</p>
        </div>

        <div id="question-area">
            <div id="question-text" class="question-text"></div>
            <div class="options-container" id="options-container">
                <!-- Options will be here -->
            </div>
        </div>

        <div id="feedback-msg" class="feedback-msg"></div>

        <button id="submit-btn" class="btn-action" onclick="submitAnswer()">Nộp bài</button>
        <button id="next-btn" class="btn-action" onclick="nextQuestion()">Tiếp theo</button>
    </div>

    <div class="footer">
        NguyenAnhTu-K16THO1-QuocPhong
    </div>

    <script>
        let quizData = [];
        let currentIdx = 0;
        let score = 0;

        const qText = document.getElementById('question-text');
        const optionsBox = document.getElementById('options-container');
        const feedbackBox = document.getElementById('feedback-msg');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');

        fetch('data-v2.json')
            .then(res => res.json())
            .then(data => {
                quizData = data;
                renderQuestion();
            })
            .catch(err => {
                qText.innerHTML = "Lỗi tải dữ liệu. Hãy chạy qua Live Server!";
            });

        function renderQuestion() {
            if (currentIdx >= quizData.length) {
                showFinalResult();
                return;
            }

            const currentQ = quizData[currentIdx];
            progressText.innerText = `Câu ${currentIdx + 1} / ${quizData.length}`;
            qText.innerText = currentQ.cauhoi;
            optionsBox.innerHTML = '';
            feedbackBox.innerText = '';
            
            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';

            currentQ.options.forEach((opt, index) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                label.innerHTML = `
                    <input type="radio" name="quiz-opt" value="${index}">
                    <span>${opt}</span>
                `;
                optionsBox.appendChild(label);
            });
        }

        function submitAnswer() {
            const selected = document.querySelector('input[name="quiz-opt"]:checked');
            if (!selected) {
                feedbackBox.innerText = "Vui lòng chọn một đáp án!";
                feedbackBox.style.color = 'orange';
                return;
            }

            const userChoice = parseInt(selected.value);
            const correctChoice = quizData[currentIdx].dapan;
            const labels = document.querySelectorAll('.option-label');

            // Disable all inputs
            document.querySelectorAll('input[name="quiz-opt"]').forEach(input => input.disabled = true);

            if (userChoice === correctChoice) {
                score++;
                labels[userChoice].classList.add('correct-choice');
                feedbackBox.innerText = "Chính xác! 🎉";
                feedbackBox.style.color = 'var(--success-color)';
            } else {
                labels[userChoice].classList.add('wrong-choice');
                labels[correctChoice].classList.add('correct-choice'); // Show correct answer
                feedbackBox.innerText = "Sai rồi! Đáp án đúng được tô màu xanh.";
                feedbackBox.style.color = 'var(--error-color)';
            }

            submitBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            renderQuestion();
        }

        function showFinalResult() {
            document.getElementById('quiz-title').innerText = "Kết quả";
            progressText.innerText = "Hoàn thành bài thi";
            document.getElementById('question-area').innerHTML = `
                <div style="text-align:center; font-size: 2rem; margin: 20px 0;">
                    ${score} / ${quizData.length}
                </div>
                <p style="text-align:center">Bạn đã trả lời đúng ${score} câu hỏi.</p>
            `;
            feedbackBox.innerText = '';
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            
            const retryBtn = document.createElement('button');
            retryBtn.className = 'btn-action';
            retryBtn.innerText = "Làm lại bài thi";
            retryBtn.onclick = () => location.reload();
            document.getElementById('quiz-box').appendChild(retryBtn);
        }
    </script>
</body>
</html>
