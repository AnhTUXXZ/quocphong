<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống thi trắc nghiệm</title>
    <style>
        /* CSS Làm đẹp giao diện */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            width: 450px;
            max-width: 90%;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-size: 24px;
            color: #764ba2;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .question {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #2d3748;
            line-height: 1.4;
        }

        input[type="text"] {
            width: calc(100% - 24px);
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }

        .correct { color: #38a169; }
        .incorrect { color: #e53e3e; }

        /* Footer theo yêu cầu */
        .footer {
            margin-top: 40px;
            font-size: 16px;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }

        .progress {
            font-size: 14px;
            color: #718096;
            margin-bottom: 10px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz">
        <div class="header-title">Bài Kiểm Tra</div>
        <div id="progress" class="progress">Câu: 1/1</div>
        <div id="question-text" class="question">Đang tải câu hỏi...</div>
        
        <input type="text" id="answer-input" placeholder="Nhập câu trả lời của bạn vào đây..." autocomplete="off">
        <button id="submit-btn" onclick="checkAnswer()">Gửi Câu Trả Lời</button>
        
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="footer">
        NguyenAnhTu-K16THO1-QuocPhong
    </div>

    <script>
        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;

        // Đọc dữ liệu từ file data.json
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error("Không tìm thấy file data.json");
                return response.json();
            })
            .then(data => {
                quizData = data;
                loadQuestion();
            })
            .catch(error => {
                // Đề phòng trường hợp chạy file HTML trực tiếp không qua server, trình duyệt chặn fetch
                console.warn(error);
                document.getElementById('question-text').innerHTML = "<span style='color:red'>Lỗi: Không thể tải data.json. Vui lòng chạy web qua Live Server (VSCode) hoặc local server.</span>";
            });

        function loadQuestion() {
            if (currentQuestionIndex < quizData.length) {
                document.getElementById('progress').innerText = `Câu: ${currentQuestionIndex + 1} / ${quizData.length}`;
                document.getElementById('question-text').innerText = quizData[currentQuestionIndex].cauhoi;
                document.getElementById('answer-input').value = '';
                document.getElementById('feedback').innerText = '';
                document.getElementById('answer-input').focus();
            } else {
                showResults();
            }
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answer-input');
            const submitBtn = document.getElementById('submit-btn');
            const feedbackEl = document.getElementById('feedback');

            // Xóa khoảng trắng thừa và chuyển về chữ thường để so sánh không phân biệt hoa thường
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = quizData[currentQuestionIndex].Dapan.trim().toLowerCase();

            if (userAnswer === '') {
                feedbackEl.innerText = "Vui lòng nhập câu trả lời!";
                feedbackEl.className = "feedback incorrect";
                answerInput.focus();
                return;
            }

            // Khóa nút và ô nhập liệu trong lúc chờ chuyển câu
            answerInput.disabled = true;
            submitBtn.disabled = true;

            if (userAnswer === correctAnswer) {
                score++;
                feedbackEl.innerText = "✔️ Chính xác!";
                feedbackEl.className = "feedback correct";
            } else {
                feedbackEl.innerText = `❌ Sai rồi! Đáp án đúng là: ${quizData[currentQuestionIndex].Dapan}`;
                feedbackEl.className = "feedback incorrect";
            }

            currentQuestionIndex++;
            
            // Đợi 1.5 giây để người dùng đọc thông báo rồi tự chuyển sang câu tiếp theo
            setTimeout(() => {
                answerInput.disabled = false;
                submitBtn.disabled = false;
                loadQuestion();
            }, 1500);
        }

        function showResults() {
            const quizContainer = document.getElementById('quiz');
            quizContainer.innerHTML = `
                <div class="header-title">Hoàn Thành!</div>
                <div class="question" style="font-size: 30px; color: #764ba2;">
                    ${score} / ${quizData.length}
                </div>
                <p style="margin-bottom: 20px; color: #4a5568;">Bạn đã trả lời đúng ${score} trên tổng số ${quizData.length} câu hỏi.</p>
                <button onclick="location.reload()">Làm Lại Bài Thi</button>
            `;
        }
        
        // Hỗ trợ nhấn phím Enter để gửi câu trả lời
        document.getElementById("answer-input").addEventListener("keypress", function(event) {
          if (event.key === "Enter") {
            event.preventDefault();
            document.getElementById("submit-btn").click();
          }
        });
    </script>
</body>
</html>
