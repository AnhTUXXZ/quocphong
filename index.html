<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Ôn Tập Quốc Phòng</title>
    <style>
        /* === TONE MÀU QUÂN ĐỘI === */
        :root {
            --army-dark: #2c3525;    /* Xanh rêu đậm */
            --army-medium: #4b5320;  /* Xanh olive */
            --army-light: #8a9a5b;   /* Xanh lính nhạt */
            --khaki: #e6e2d3;        /* Vàng cát / Khaki */
        }

        body {
            font-family: 'Courier New', Courier, 'Segoe UI', monospace;
            background-color: var(--army-medium);
            margin: 0;
            padding: 0;
            color: var(--army-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-banner {
            background-color: var(--army-dark);
            color: var(--khaki);
            text-align: center;
            padding: 25px 20px;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 5px solid #1a1f16;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Lưới chứa các nút bấm */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            background-color: var(--khaki);
            padding: 30px;
            border: 4px solid var(--army-dark);
            border-radius: 12px;
            box-shadow: 8px 8px 0px var(--army-dark);
        }

        /* Nút chuyển hướng */
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--army-dark);
            color: var(--khaki);
            text-decoration: none;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #1a1f16;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
        }

        .menu-item span {
            font-size: 1rem;
            margin-top: 8px;
            color: var(--army-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .menu-item:hover {
            background-color: var(--army-light);
            color: var(--army-dark);
            transform: translateY(-5px);
            box-shadow: 4px 8px 15px rgba(0,0,0,0.4);
            border-color: var(--army-dark);
        }

        .menu-item:hover span {
            color: var(--army-dark);
        }

        .footer {
            background-color: var(--army-dark);
            color: var(--khaki);
            text-align: center;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        HỆ THỐNG TRẮC NGHIỆM QUỐC PHÒNG
    </div>

    <div class="container">
        <div class="menu-grid">
            <!-- Link đến Chương 1 -->
            <a href="https://anhtuxxz.github.io/quocphong/C1" class="menu-item" target="_blank">
                Chủ Đề 1
                <span>Nhấn để làm bài</span>
            </a>
            
            <!-- Link đến Chương 2 -->
            <a href="https://anhtuxxz.github.io/quocphong/C2" class="menu-item" target="_blank">
                Chủ Đề 2
                <span>Nhấn để làm bài</span>
            </a>
            
            <!-- Link đến Chương 3 -->
            <a href="https://anhtuxxz.github.io/quocphong/C3" class="menu-item" target="_blank">
                Chủ Đề 3
                <span>Nhấn để làm bài</span>
            </a>
            
            <!-- Link đến Chương 4 -->
            <a href="https://anhtuxxz.github.io/quocphong/C4" class="menu-item" target="_blank">
                Chủ Đề 4
                <span>Nhấn để làm bài</span>
            </a>
            
            <!-- Link đến Chương 5 -->
            <a href="https://anhtuxxz.github.io/quocphong/C5" class="menu-item" target="_blank">
                Chủ Đề 5
                <span>Nhấn để làm bài</span>
            </a>
        </div>
    </div>

    <div class="footer">
        NguyenAnhTu-K16THO1-QuocPhong
    </div>

</body>
</html>
